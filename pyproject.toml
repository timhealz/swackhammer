[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swackhammer"
version = "0.1.0"
description = "Utilities for fetching NBA player data and exporting to S3 as Parquet"
authors = [{name = "Swackhammer"}]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["nba", "data", "parquet", "s3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "nba_api>=1.4.1",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.10"]

[project.scripts]
swackhammer-run = "swackhammer.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swackhammer"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
